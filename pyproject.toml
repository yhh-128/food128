[project]
name = "gift-agent"
version = "0.1.0"
description = "Discord bot that identifies gifts, scores the thoughtfulness (1-10), and keeps a private gift cabinet per user in Excel."
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
gift-agent = "gift_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
